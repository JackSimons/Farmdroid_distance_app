<!DOCTYPE html>

<html>

<head>

  <title>Farmdroid afstandstool met kaart</title>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0">



  <!-- Leaflet CSS -->

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet JS -->

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Proj4JS for coordinate conversion -->

  <script src="https://unpkg.com/proj4@2.9.1/dist/proj4.js"></script>



  <style>

    #map { height: 400px; width: 100%; margin-bottom: 1em; }

    body { font-family: Arial, sans-serif; margin: 1em; }

  </style>

</head>

<body>

  <h2>Farmdroid afstandstool met kaart en input printscreens</h2>
  
  <p>Voer handmatig coördinaten in of upload een screenshot van de FarmDroid-app, waar Lat en Lon in kaart weergegeven staan. Wel even de coordinaten controleren na het laden.</p>

  <label>Punt A (lat, lng):</label><br>

  <input id="lat1" value="51.58793151"> <input id="lng1" value="4.36962101"><br><br> <input type="file" accept="image/*" id="uploadA"> <div id="resultA" class="upload-result"></div> </div>

  <label>Punt B (lat, lng):</label><br>

  <input id="lat2" value="51.58449268"> <input id="lng2" value="4.37079518"><br><br> <input type="file" accept="image/*" id="uploadB"> <div id="resultB" class="upload-result"></div> </div>

  <label>Punt C (lat, lng):</label><br>

  <input id="lat3" value="51.58455367"> <input id="lng3" value="4.37218218"><br><br> <input type="file" accept="image/*" id="uploadC"> <div id="resultC" class="upload-result"></div> </div>

  <label>Safetyzone (min 1.2 meter):</label><br>

  <input id="safety" value="1.2"><br><br>

  <button onclick="bereken()">Bereken</button>

  <h3 id="resultaat"></h3>

  <div id="map"></div>

  <script>

    // Init map
    const map = L.map('map').setView([51.5879, 4.3695], 17);

    // ✅ Satelliet-achtergrondlaag
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics', 
      maxZoom: 20
    }).addTo(map);


    let markers = [];

    let polyline;



    // RD definition

    proj4.defs("EPSG:28992", 

      "+proj=sterea +lat_0=52.15616055555555 +lon_0=5.38763888888889 " +

      "+k=0.9999079 +x_0=155000 +y_0=463000 +ellps=bessel +units=m +no_defs");


    function afstandTotLijn(A, B, C) {

      const AB = [B[0] - A[0], B[1] - A[1]];

      const AC = [C[0] - A[0], C[1] - A[1]];

      const dot = AB[0]*AC[0] + AB[1]*AC[1];

      const lenSq = AB[0]*AB[0] + AB[1]*AB[1];

      const t = dot / lenSq;

      const proj = [A[0] + t * AB[0], A[1] + t * AB[1]];

      const dx = C[0] - proj[0];

      const dy = C[1] - proj[1];

      return Math.sqrt(dx*dx + dy*dy);

    }

    function afstandTotOneindigeLijn(A, B, C) {
      const x0 = C[0], y0 = C[1];
      const x1 = A[0], y1 = A[1];
      const x2 = B[0], y2 = B[1];
      
      const numerator = Math.abs((y2 - y1) * x0 - (x2 - x1) * y0 + x2*y1 - y2*x1);
      const denominator = Math.sqrt((y2 - y1)**2 + (x2 - x1)**2);
      
      return numerator / denominator;
    }
    



    function richtingInGraden(A, B) {

      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;

      const omega1 = toRad(A[1]);
      const omega2 = toRad(B[1]);
      const dLapda = toRad(B[0] - A[0]);

      const y = Math.sin(dLapda) * Math.cos(omega2);
      const x = Math.cos(omega1) * Math.sin(omega2) - Math.sin(omega1) * Math.cos(omega2) * Math.cos(dLapda);

      let Omega = Math.atan2(y, x);
      let deg = toDeg(Omega);

      //if(deg > 180) deg -= 360;
      //if(deg < -180) deg += 360;

      //return deg;

      //const dx = B[0] - A[0];

      //const dy = B[1] - A[1];

      //const rad = Math.atan2(dx, dy);

      //let deg = rad * (180 / Math.PI);

      //if (deg < 0) deg += 360;

      //deg = (deg + 360) % 360;

      return deg;

    }

        function bereken() {

      const A = [parseFloat(document.getElementById("lng1").value), parseFloat(document.getElementById("lat1").value)];

      const B = [parseFloat(document.getElementById("lng2").value), parseFloat(document.getElementById("lat2").value)];

      const C = [parseFloat(document.getElementById("lng3").value), parseFloat(document.getElementById("lat3").value)];

      let safety = Math.max(1.2, parseFloat(document.getElementById("safety").value));



      const A_rd = proj4("EPSG:4326", "EPSG:28992", A);

      const B_rd = proj4("EPSG:4326", "EPSG:28992", B);

      const C_rd = proj4("EPSG:4326", "EPSG:28992", C);



      //const afstand = afstandTotLijn(A_rd, B_rd, C_rd);
      const afstand = afstandTotOneindigeLijn(A_rd, B_rd, C_rd);
      
      const rest = afstand - 2 * safety;

      const restClean = rest > 0 ? rest : 0;

      const restNa3 = restClean % 3;

      const afwijking = restNa3 < 1.5 ? restNa3 : 3 - restNa3;

      const bearing = richtingInGraden(A, B);
      const bearing2 = richtingInGraden(B, A);



      document.getElementById("resultaat").innerHTML = `

        📏 Afstand C tot lijn AB: <b>${afstand.toFixed(2)} m</b><br>

        🛑 Na 2× safetyzone (${(2*safety).toFixed(2)} m): <b>${restClean.toFixed(2)} m</b><br>

        📐 Afwijking van veelvoud van 3 m: <b>${afwijking.toFixed(2)} m</b><br>

        🧭 Richting A → B = <b>${bearing.toFixed(10)}°</b>
        🧭 Richting B → A = <b>${bearing2.toFixed(10)}°</b>

      `;



      // Clear old markers/lines

      markers.forEach(m => map.removeLayer(m));

      markers = [];

      if (polyline) map.removeLayer(polyline);



      // Draw new markers and line

      markers.push(L.marker([A[1], A[0]]).addTo(map).bindPopup("Punt A"));

      markers.push(L.marker([B[1], B[0]]).addTo(map).bindPopup("Punt B"));

      markers.push(L.marker([C[1], C[0]]).addTo(map).bindPopup("Punt C"));



      polyline = L.polyline([[A[1], A[0]], [B[1], B[0]]], {color: 'blue'}).addTo(map);

      map.fitBounds(polyline.getBounds(), {padding: [30, 30]});

    }
  </script>
 
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
// -------------------------------
// 1) PREPROCESSING: crop + contrast
// -------------------------------
async function cropCoordinatesArea(img) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    // ✔ Crop exact gebied waar Lat/Lon staan
    const cropY = img.height * 0.55;
    const cropHeight = img.height * 0.11;
    const cropX = img.width * 0.05;
    const cropWidth = img.width * 0.90;

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    // ✔ contrast/brightness + grayscale voor maximale OCR-kwaliteit
    ctx.filter = "contrast(260%) brightness(150%) grayscale(100%)";
    ctx.drawImage(
        img,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, cropWidth, cropHeight
    );

    return new Promise(resolve =>
        canvas.toBlob(resolve, "image/png")
    );
}

// -------------------------------
// 2) OCR functie
// -------------------------------
async function extractCoordinatesFromImage(file, resultElement, latInput, lonInput) {
    const img = new Image();
    img.src = URL.createObjectURL(file);

    await new Promise(resolve => img.onload = resolve);

    // 1. OCR de hele afbeelding (lage resolutie → snel)
    const fullResult = await Tesseract.recognize(img, "eng", {
        tessedit_char_whitelist: "LatLon:0123456789.-",
    });

    // Zoek het woord "Lat"
    const latWord = fullResult.data.words.find(w => w.text.includes("Lat"));

    if (!latWord) {
        document.getElementById(resultElement).innerHTML =
            "❌ Geen coördinaten gevonden";
        console.warn("Lat: niet gevonden in volledige OCR → geen coördinaten.");
        return;
    }

    // 2. Bepaal crop-gebied rondom de Lat/Lon tekst
    const padding = 30;
    const cropX = Math.max(latWord.bbox.x0 - padding, 0);
    const cropY = Math.max(latWord.bbox.y0 - padding, 0);
    const cropWidth = Math.min(600, img.width - cropX);
    const cropHeight = Math.min(250, img.height - cropY);

    // 3. Crop canvas maken
    const canvas = document.createElement("canvas");
    canvas.width = cropWidth;
    canvas.height = cropHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

    // 4. OCR opnieuw, maar nu nauwkeurig
    const cropResult = await Tesseract.recognize(canvas, "eng");

    const text = cropResult.data.text;

    const latMatch = text.match(/Lat:\s*([0-9.-]+)/i);
    const lonMatch = text.match(/Lon:\s*([0-9.-]+)/i);

    if (latMatch && lonMatch) {
        latInput.value = latMatch[1];
        lonInput.value = lonMatch[1];
        document.getElementById(latInput).value = latMatch[1];
        document.getElementById(lonInput).value = lonMatch[1];

        document.getElementById(resultElement).innerHTML =
        `📍 Gevonden:<br>Lat: <b>${latMatch[1]}</b><br>Lon: <b>${lonMatch[1]}</b>`;
        

        console.log("GOEDGEKEURDE OCR:", latMatch[1], lonMatch[1]);
        return { lat: latMatch[1], lon: lonMatch[1] };
    }

    document.getElementById(resultElement).innerHTML =
            "❌ Geen coördinaten gevonden";
    console.warn("OCR kon Lat/Lon niet vinden in crop.");
}


// -------------------------------
// 3) Upload event listeners
// -------------------------------
document.getElementById("uploadA")
    .addEventListener("change", e =>
         extractCoordinatesFromImage(e.target.files[0], "resultA", "lat1", "lng1")
    );

document.getElementById("uploadB")
    .addEventListener("change", e =>
        extractCoordinatesFromImage(e.target.files[0], "resultB", "lat2", "lng2")
    );

document.getElementById("uploadC")
    .addEventListener("change", e =>
        extractCoordinatesFromImage(e.target.files[0], "resultC", "lat3", "lng3")
    );
</script>


</body>

</html>
